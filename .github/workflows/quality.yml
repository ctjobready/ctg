name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type and template check
        run: npm run check
      - name: Build (staging)
        run: npm run build
        env:
          SITE_ENV: staging
          SITE_URL: https://ctjobready.github.io
          BASE_PATH: /ctg
      - name: Fact status and public-citation gate
        run: npm run check:facts
      - name: "Asset permissions (staging: warn only)"
        run: npm run check:permissions
        env:
          SITE_ENV: staging
